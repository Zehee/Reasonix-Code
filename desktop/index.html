<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Reasonix Code</title>
    <style>
      :root {
        --brand: #339933;
        --brand-soft: #e8f3e8;
        --ink: #16181a;
        --ink-2: #5c636a;
        --ink-3: #8a9198;
        --danger: #e5484d;
        --line: #e3e6e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 78vw;
        padding: 40px 24px;
      }

      .logo {
        width: 108px;
        height: 108px;
        margin-bottom: 26px;
        filter: drop-shadow(0 14px 30px rgba(51, 153, 51, 0.22));
        animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.1, 1) both;
      }
      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .title {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink);
        animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.1, 1) 0.06s both;
      }

      /* Tiny pixel loading dots — 3 green squares hopping in steps() */
      .pix {
        display: flex;
        gap: 5px;
        margin: 18px 0 6px;
        animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.1, 1) 0.12s both;
      }
      .pix i {
        width: 6px;
        height: 6px;
        border-radius: 1px;
        background: var(--brand);
        animation: pix-hop 0.9s steps(2, jump-none) infinite;
      }
      .pix i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .pix i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pix-hop {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        50% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      #status {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--ink-2);
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 20px;
        animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.1, 1) 0.18s both;
      }
      #status.error {
        color: var(--danger);
      }

      #actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 24px;
        min-width: 240px;
        animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.1, 1) 0.24s both;
      }

      button {
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        padding: 10px 22px;
        border-radius: 8px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.12s ease, background 0.12s ease;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      button:active {
        transform: translateY(1px);
      }
      button.primary {
        background: var(--brand);
        color: #ffffff;
        box-shadow: 0 6px 18px -6px rgba(51, 153, 51, 0.45);
      }
      button.primary:hover {
        background: #2c8630;
        box-shadow: 0 8px 22px -6px rgba(51, 153, 51, 0.5);
      }
      button.secondary {
        background: #ffffff;
        color: var(--brand);
        border-color: var(--line);
      }
      button.secondary:hover {
        background: var(--brand-soft);
        border-color: rgba(51, 153, 51, 0.35);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
