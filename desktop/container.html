<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Reasonix Code</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(1200px 800px at 50% -10%, #12281a 0%, #0b0b0b 55%);
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Each workspace dashboard fills the window; the dashboards render
         their own TabBar (driven via postMessage) — this page owns only
         the iframes and the empty/picker state. */
      #frames {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      .ws-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: #0b0b0b;
        z-index: 1;
      }

      /* Ambient particle layer behind the picker (see container.js). */
      #particles {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      /* ── Workspace picker (empty state) ─────────────────────── */
      #empty {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: #e5e5e5;
        text-align: center;
        z-index: 1;
      }
      #empty.show {
        display: flex;
      }

      .empty-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 560px;
        padding: 24px;
        animation: empty-in 0.5s cubic-bezier(0.2, 0.7, 0.1, 1) both;
      }
      @keyframes empty-in {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        width: 88px;
        height: 88px;
        margin-bottom: 22px;
        filter: drop-shadow(0 16px 34px rgba(51, 153, 51, 0.28));
      }
      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .tagline {
        margin: 8px 0 0;
        font-size: 14px;
        color: #9fb3a6;
        letter-spacing: 0.01em;
      }
      .desc {
        margin: 14px 0 0;
        font-size: 12.5px;
        line-height: 1.7;
        color: #6d7a72;
      }

      /* Recent workspace card */
      .recent {
        display: none;
        width: 100%;
        margin-top: 28px;
        text-align: left;
      }
      .recent-label {
        font-size: 11px;
        color: #6d7a72;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .recent-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #2a2f2c;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        color: #e5e5e5;
        font: inherit;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s, border-color 0.15s, transform 0.08s;
      }
      .recent-item:hover {
        background: rgba(51, 153, 51, 0.08);
        border-color: rgba(51, 153, 51, 0.4);
      }
      .recent-item:active {
        transform: translateY(1px);
      }
      .recent-item .folder {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: rgba(51, 153, 51, 0.12);
        color: #4caf50;
      }
      .recent-item .recent-name {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .recent-item .recent-path {
        font-size: 11px;
        color: #6d7a72;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 160px;
      }
      .recent-item .open {
        flex-shrink: 0;
        font-size: 12px;
        color: #4caf50;
        border: 1px solid rgba(51, 153, 51, 0.35);
        border-radius: 6px;
        padding: 4px 10px;
      }

      /* Primary action */
      /* API key setup panel */
      .key-panel {
        margin-top: 22px;
        width: 100%;
        min-width: min(500px, 100%);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.03);
        text-align: left;
        animation: rise 0.35s ease both;
      }
      .key-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 10px;
        text-align: left;
      }
      .key-notice {
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ink-2);
        background: rgba(51, 153, 51, 0.1);
        border: 1px solid rgba(51, 153, 51, 0.28);
        border-radius: 9px;
        padding: 10px 12px;
        margin-bottom: 14px;
        text-align: left;
      }
      .key-row {
        display: flex;
        gap: 8px;
      }
      #key-input {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 13.5px;
        color: var(--ink);
        background: #101410;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 12px 14px;
        outline: none;
      }
      #key-input:hover {
        border-color: rgba(255, 255, 255, 0.32);
      }
      #key-input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 2px rgba(51, 153, 51, 0.18);
      }
      .key-row .key-save {
        width: auto;
        flex-shrink: 0;
        padding: 12px 18px;
      }
      .key-hint {
        text-align: left;
        margin: 12px 0 0;
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .key-hint code {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        color: var(--ink-2);
      }

      .actions {
        margin-top: 18px;
        width: 100%;
      }
      button.action {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 10px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: background 0.15s, box-shadow 0.15s, transform 0.08s;
      }
      button.action:active {
        transform: translateY(1px);
      }
      button.action.primary {
        background: linear-gradient(135deg, #3aa544, #2d8a38);
        color: #ffffff;
        box-shadow: 0 8px 24px -8px rgba(51, 153, 51, 0.55);
      }
      button.action.primary:hover {
        background: linear-gradient(135deg, #43b54e, #32963d);
        box-shadow: 0 10px 28px -8px rgba(51, 153, 51, 0.65);
      }
      button.action.secondary {
        background: transparent;
        color: #8fa396;
        border-color: #2a2f2c;
      }
      button.action.secondary:hover {
        background: rgba(255, 255, 255, 0.04);
        color: #c8d4cc;
      }

      .hint {
        margin-top: 16px;
        font-size: 11.5px;
        color: #545d57;
      }
      .hint b {
        color: #7d8f83;
        font-weight: 600;
      }

      #errbar {
        display: none;
        position: fixed;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 70vw;
        padding: 8px 14px;
        border-radius: 8px;
        background: #2b1414;
        border: 1px solid #5c2a2a;
        color: #ff6b6b;
        font-size: 12.5px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="particles" aria-hidden="true"></canvas>
    <div id="frames"></div>

    <div id="empty">
      <div class="empty-inner">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 1254 1254" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <style>
                .c { fill: #339933; }
              </style>
            </defs>

            <circle class="c" cx="640.36" cy="538.21" r="3.47"/>
            <path class="c" d="M504.6,517.71c-7.75.94-12.41,6.5-11.66,14.8,5.25,57.86,58.62,105.22,118.44,93.8,12.73-2.43,24.33-7.49,33.74-16.99-20.35-17.53-30.27-35.39-47.01-52.99-23.95-25.18-58.04-42.91-93.5-38.62Z"/>
          </svg>
        </div>
        <h1>Reasonix Code</h1>
        <p class="tagline">选择一个工作区开始</p>
        <p class="desc">工作区对应一个代码目录，每个工作区拥有独立的会话、上下文与工具状态，互不干扰。</p>

        <div class="recent" id="recent-wrap"></div>

        <div class="actions">
          <button type="button" class="action primary" id="btn-choose">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            选择工作区文件夹…
          </button>
        </div>

        <div class="key-panel" id="key-panel" hidden>
          <div class="key-title">首次使用：配置 API Key</div>
          <div class="key-notice">Reasonix-Code 需要 DeepSeek API Key 才能运行。填入后保存，即可开始使用。</div>
          <div class="key-row">
            <input type="password" id="key-input" placeholder="sk-…" autocomplete="off" spellcheck="false" />
            <button type="button" class="action primary key-save" id="key-save">保存并开始</button>
          </div>
          <p class="key-hint">也可在终端运行 <code>reasonix-code setup</code> 完成同样的配置</p>
        </div>

        <p class="hint">进入后可通过顶部 <b>+</b> 新建工作区，或在状态栏随时切换</p>
      </div>
    </div>

    <div id="errbar" role="alert"></div>

    <script src="container.js"></script>
  </body>
</html>
